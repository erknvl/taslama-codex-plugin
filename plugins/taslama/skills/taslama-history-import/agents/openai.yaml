interface:
  display_name: "Taslama History Import"
  short_description: "Recover salon history from messy Excel journals"
  default_prompt: "Use $taslama-history-import to audit and import this salon history workbook safely."
dependencies:
  tools:
    - type: "mcp"
      value: "taslama"
      description: "Taslama project-scoped customer and booking operations"
      transport: "streamable_http"
      url: "https://app.taslama.agency/api/mcp"
policy:
  allow_implicit_invocation: true
